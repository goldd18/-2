.client-card .when{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:#111}

html{scroll-behavior:smooth}
.reveal{opacity:0;transform:translateY(52px);transition:opacity 1.25s ease,transform 1.35s cubic-bezier(.22,.61,.36,1);will-change:opacity,transform}
.reveal.in{opacity:1;transform:none}
.section.in .section-title,.kontacts.in .section-title{animation:riseIn 1.2s cubic-bezier(.22,.61,.36,1) both}
.section.in .section-sub,.kontacts.in .section-sub{animation:riseIn 1.2s cubic-bezier(.22,.61,.36,1) .12s both}
.section.in .about-item,.section.in .pf-tile,.section.in .svc-row,.section.in .glass-card,.section.in .lookup-card,.kontacts.in .k-link,.kontacts.in .k-plain,.section.in .svc-list{
  animation:riseIn 1.15s cubic-bezier(.22,.61,.36,1) both
}
.section.in .about-item:nth-child(2),.section.in .pf-tile:nth-child(2),.section.in .svc-row:nth-child(2){animation-delay:.12s}
.section.in .about-item:nth-child(3),.section.in .pf-tile:nth-child(3),.section.in .svc-row:nth-child(3){animation-delay:.22s}
.section.in .pf-tile:nth-child(4),.section.in .svc-row:nth-child(4){animation-delay:.32s}
.section.in .lookup-card{animation-delay:.16s}
.kontacts.in .k-link:nth-of-type(2){animation-delay:.12s}
.kontacts.in .k-plain:nth-of-type(1){animation-delay:.22s}
.kontacts.in .k-plain:nth-of-type(2){animation-delay:.3s}
.kontacts.in .k-plain:nth-of-type(3){animation-delay:.38s}
@keyframes riseIn{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal,.reveal.in{opacity:1;transform:none;transition:none}
  .section.in .about-item,.section.in .pf-tile,.section.in .svc-row,.kontacts.in .k-link,.kontacts.in .k-plain,.section.in .section-title,.section.in .section-sub,.section.in .glass-card,.section.in .lookup-card,.section.in .svc-list,.kontacts.in .section-title,.kontacts.in .section-sub{animation:none}
}
@media(min-width:820px){
  .nav-desktop{display:flex}
  .burger{display:none}
  .wrap{max-width:520px}
  .hero{padding:56px 0 70px}
  .hero-photo{max-width:380px;margin:0 auto}

  .portfolio-grid{grid-template-columns:repeat(4,1fr)}
  .time-grid{grid-template-columns:repeat(4,1fr)}
  footer{padding-bottom:40px}
}

</style>

function cloud(action, extra){
  const payload=Object.assign({
    action,

    .then(async r=>{

      if(!r.ok && !data.error) data.error=r.status===404?'missing_api':('http_'+r.status);

function queueCloudSave(parts){
  if(!isStaff()) return;
  queueCloudSave.parts=Object.assign(queueCloudSave.parts||{}, parts||{site:1,bookings:1,clients:1});
  clearTimeout(queueCloudSave.t);
  queueCloudSave.t=setTimeout(async ()=>{
    const next=queueCloudSave.parts||{};
    queueCloudSave.parts={};
    const payload={};
    if(next.site) payload.site=site;
    if(next.bookings && bookingsAreFull(bookings)) payload.bookings=bookings;
    if(next.clients) payload.clients=clients;
    if(!payload.site && !payload.bookings && !payload.clients) return;
    const data=await cloud('save', payload);
    fillCloudBanner();
    if(data&&data.ok) return;
    if(data&&data.error==='no_store') showToast('Фото и правки не увидят другие: в Vercel создайте Storage → Blob и сделайте Redeploy');
    else if(data&&data.error==='missing_api') showToast('На GitHub не попала папка api. Залейте её из «готовый релиз»');

  },700);
}

function observeReveal(){

  const els=document.querySelectorAll('main > section, footer');

    entries.forEach(e=>{
      if(!e.isIntersecting) return;
      e.target.classList.add('in');
      revealIO.unobserve(e.target);
    });
  },{threshold:0.12,rootMargin:'0px 0px -12% 0px'});
  els.forEach(el=>{

function getDaySettings(dateStr){
  const ov=site.overrides[dateStr]; const dow=new Date(dateStr+'T00:00:00').getDay();
  if(ov){if(ov.closed) return null; return {start:ov.start||site.work.start,end:ov.end||site.work.end}}
  if(!(site.work.days||[]).includes(dow)) return null;
  return {start:site.work.start,end:site.work.end};
}

function renderTimeGrid(){
  const grid=document.getElementById('timeGrid'); grid.innerHTML='';
  if(!bstate.date||!bstate.serviceId) return;
  const settings=getDaySettings(bstate.date); const svc=site.services.find(s=>s.id===bstate.serviceId);
  if(!settings||!svc){grid.innerHTML='<div class="empty-note">В этот день мастер не работает</div>'; return}
  const step=site.work.slot, startM=timeToMin(settings.start), endM=timeToMin(settings.end);
  const dayBk=(bookings[bstate.date]||[]).filter(b=>(b.status||'active')==='active'); const now=new Date(); const isToday=toDateStr(now)===bstate.date; const nowM=now.getHours()*60+now.getMinutes();
  let any=false;
  for(let t=startM;t+svc.duration<=endM;t+=step){
    let blocked=isToday && t<=nowM+15;
    for(const b of dayBk){const bs=timeToMin(b.time), be=bs+b.duration; if(t<be && bs<t+svc.duration){blocked=true;break}}
    const btn=document.createElement('button'); btn.className='time-slot'; btn.type='button'; btn.textContent=minToTime(t); btn.disabled=blocked;
    if(!blocked){any=true; btn.onclick=()=>{bstate.time=minToTime(t); document.querySelectorAll('.time-slot').forEach(s=>s.classList.remove('selected')); btn.classList.add('selected'); document.getElementById('toStep3').disabled=false}}
    grid.appendChild(btn);
  }
  if(!any) grid.innerHTML='<div class="empty-note">Свободных окон нет</div>';
}

async function submitBooking(){
  const name=document.getElementById('clientName').value.trim();
  const phone=document.getElementById('clientPhone').value.trim();
  const note=document.getElementById('clientNote').value.trim();
  if(!name||!phone){showToast('Заполните имя и телефон'); return}
  const svc=site.services.find(s=>s.id===bstate.serviceId);
  const id='b'+Date.now();
  const rec={id,time:bstate.time,name,phone,note,serviceId:svc.id,serviceName:svc.name,duration:svc.duration,price:svc.price,createdAt:new Date().toISOString(),reminderSent:false,status:'active'};
  const saved=await cloud('book',{date:bstate.date,booking:Object.assign({date:bstate.date},rec)});
  if(saved&&saved.ok===false&&saved.error==='taken'){showToast('Это время уже заняли'); return}
  if(isStaff()){
    if(!bookings[bstate.date]) bookings[bstate.date]=[];
    if(!bookings[bstate.date].some(b=>b.id===rec.id)) bookings[bstate.date].push(rec);
  } else if(saved&&saved.bookings) bookings=saved.bookings;
  else {
    if(!bookings[bstate.date]) bookings[bstate.date]=[];
    bookings[bstate.date].push(rec);
  }
  persistBk();
  upsertClient(name,phone,note);
  lastBooking={date:bstate.date,id,phone,name,time:bstate.time,serviceName:svc.name,price:svc.price,note};
  notifyMasterTelegram({name,phone,date:bstate.date,time:bstate.time,service:svc.name,note});
  const d=new Date(bstate.date+'T00:00:00');
  const sms=await sendBookingSms('confirm',{date:bstate.date,name,phone,note,serviceName:svc.name,time:bstate.time,price:svc.price});
  const smsOk=!!(sms&&sms.ok);
  document.getElementById('confirmText').textContent=smsOk
    ? `${svc.name} — ${d.getDate()} ${MONTHS[d.getMonth()]} в ${bstate.time}. На ваш номер отправлено SMS.`
    : `${svc.name} — ${d.getDate()} ${MONTHS[d.getMonth()]} в ${bstate.time}. Запись сохранена.`;
  [1,2,3].forEach(i=>document.getElementById('step-'+i).classList.add('hidden'));
  document.getElementById('step-confirm').classList.remove('hidden');
  showToast(smsOk?'Запись сохранена, SMS отправлено':(saved&&saved.error==='no_store'?'Запись сохранена только в этом браузере':'Запись сохранена'));
}

async function lookupBookings(){
  const phoneN=toByPhone(document.getElementById('lookupPhone').value); const results=document.getElementById('lookupResults');
  if(phoneN.length<12){showToast('Введите номер'); return}
  let found=allBookingsFlat().filter(b=>toByPhone(b.phone)===phoneN && b.status==='active');
  if(!found.length){
    const data=await cloud('lookup',{phone:phoneN});
    found=(data&&data.found)||[];
  }
  results.innerHTML='';
  if(!found.length){results.innerHTML='<p class="empty-note">Активных записей нет</p>'; return}
  found.forEach(b=>{
    const d=new Date(b.date+'T00:00:00'); const row=document.createElement('div'); row.className='my-booking-item';
    row.innerHTML=`<span>${escapeHtml(b.serviceName)}<br><span style="color:var(--faint)">${d.getDate()} ${MONTHS[d.getMonth()]}, ${b.time}</span></span>`;
    const btn=document.createElement('button'); btn.className='btn btn-sm btn-danger'; btn.textContent='Отменить';
    btn.onclick=()=>{
      if(!bookings[b.date]) bookings[b.date]=[];
      const i=(bookings[b.date]||[]).findIndex(x=>x.id===b.id);
      if(i>-1) bookings[b.date][i]=Object.assign({},bookings[b.date][i],b);
      else bookings[b.date].push(b);
      removeBooking(b.id); showToast('Отменено'); row.remove();
    };
    row.appendChild(btn); results.appendChild(row);
  });
}
function downloadIcs(dateStr,time,serviceName){
  const[h,m]=time.split(':').map(Number); const start=new Date(dateStr+'T00:00:00'); start.setHours(h,m,0,0);
  const end=new Date(start.getTime()+60*60000);

  const ics=['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT','DTSTART:'+fmt(start),'DTEND:'+fmt(end),'SUMMARY:'+serviceName+' — '+STUDIO,'BEGIN:VALARM','TRIGGER:-P2D','ACTION:DISPLAY','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader(); r.onerror=reject; r.onload=()=>{
      const img=new Image(); img.onload=()=>{
        const max=800; let w=img.width,h=img.height; if(w>max||h>max){const k=Math.min(max/w,max/h); w=Math.round(w*k); h=Math.round(h*k)}
        const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); resolve(c.toDataURL('image/jpeg',.7));
      }; img.src=r.result;
    }; r.readAsDataURL(file);
  });
}

function renderStats(){
  const today=toDateStr(new Date());
  const flat=allBookingsFlat();
  const active=flat.filter(b=>b.status==='active'&&b.date>=today).length;
  const done=flat.filter(b=>b.status==='completed').length;
  const clientsCount=Object.keys(clients).length;
  const el=document.getElementById('statsRow');
  if(!el) return;
  el.innerHTML=`<div class="stat-card"><b>${active}</b><span>Активные</span></div><div class="stat-card"><b>${done}</b><span>Выполнено</span></div><div class="stat-card"><b>${clientsCount}</b><span>Клиенты</span></div>`;
}
function renderAdminBookings(){
  const today=toDateStr(new Date());
  let items=allBookingsFlat();
  if(bkFilter==='active') items=items.filter(b=>b.status==='active'&&b.date>=today);
  else if(bkFilter==='completed') items=items.filter(b=>b.status==='completed');
  else if(bkFilter==='cancelled') items=items.filter(b=>b.status==='cancelled');
  const due=allBookingsFlat().filter(b=>b.status==='active'&&daysUntil(b.date)>=0&&daysUntil(b.date)<=2);
  const banner=document.getElementById('reminderBanner');
  document.querySelectorAll('[data-filter]').forEach(btn=>btn.classList.toggle('on', btn.dataset.filter===bkFilter));
  if(banner) banner.textContent=due.length?`Ближайшие 2 дня: ${due.length} записей. После визита отметьте «Выполнено».`:'Отмечайте выполненные записи — они попадут в историю клиента.';
  renderStats();
  const list=document.getElementById('bkList');
  if(!list) return;
  if(!items.length){list.innerHTML='<p class="hint-box">Пока пусто</p>'; return}
  list.innerHTML=items.map(b=>{
    const d=new Date(b.date+'T00:00:00');
    const st=b.status||'active';
    const label=st==='completed'?'Выполнено':st==='cancelled'?'Отменено':'Активна';
    const actions=st==='active'?`<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-sm" data-done="${b.id}">Выполнено</button><button class="btn btn-sm btn-danger" data-cancel="${b.id}">Отменить</button></div>`:`<span class="status-pill ${st==='completed'?'done':'cancel'}">${label}</span>`;
    return `<div class="bk-card"><div class="when">${d.getDate()} ${MONTHS[d.getMonth()]} · ${b.time}</div><div class="meta">${escapeHtml(b.name)} · ${escapeHtml(b.phone)}<br>${escapeHtml(b.serviceName)}${b.note?`<br>Комментарий: ${escapeHtml(b.note)}`:''}</div>${actions}</div>`;
  }).join('');
  list.querySelectorAll('[data-done]').forEach(btn=>btn.onclick=()=>{setBookingStatus(btn.dataset.done,'completed'); showToast('Отмечено выполненным'); renderAdminBookings()});
  list.querySelectorAll('[data-cancel]').forEach(btn=>btn.onclick=()=>{setBookingStatus(btn.dataset.cancel,'cancelled'); showToast('Отменено'); renderAdminBookings()});
}
function renderClients(){
  const q=(document.getElementById('clientSearch')?.value||'').trim().toLowerCase();
  const list=document.getElementById('clientList');
  let arr=Object.values(clients).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  if(q) arr=arr.filter(c=>(c.name||'').toLowerCase().includes(q)||String(c.phone).includes(q.replace(/\D/g,'')));
  if(!arr.length){list.innerHTML='<p class="hint-box">Клиентов пока нет — они появятся после записей</p>'; return}
  list.innerHTML=arr.map(c=>{
    const hist=allBookingsFlat().filter(b=>toByPhone(b.phone)===c.phone).slice(-5).reverse()
      .map(b=>{const d=new Date(b.date+'T00:00:00'); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${b.time} · ${escapeHtml(b.serviceName)} · ${b.status||'active'}`}).join('<br>')||'Истории пока нет';
    return `<div class="client-card"><div class="when">${escapeHtml(c.name||'Без имени')}</div><div class="meta">${escapeHtml(c.phone)} · визитов: ${c.visits||0} · сумма: ${money(c.totalSpent||0)}</div>
      <textarea class="cab-input note-in" data-phone="${escapeHtml(c.phone)}" rows="2" placeholder="Заметка мастера">${escapeHtml(c.note||'')}</textarea>
      <div class="hint-box" style="margin-top:8px">${hist}</div></div>`;
  }).join('');
  list.querySelectorAll('.note-in').forEach(inp=>{
    inp.onchange=()=>{const key=inp.dataset.phone; if(clients[key]){clients[key].note=inp.value; clients[key].updatedAt=new Date().toISOString(); persistClients(); showToast('Заметка сохранена')}};
  });
  const search=document.getElementById('clientSearch');
  if(search && !search._bound){search._bound=true; search.oninput=()=>renderClients()}
  const exp=document.getElementById('exportData'); if(exp) exp.onclick=exportBackup;
  const imp=document.getElementById('importData'); if(imp) imp.onchange=e=>{const f=e.target.files[0]; if(f) importBackup(f)};
}

      return Object.assign({ok:r.ok,configured:!!(data&&data.configured)}, data);
    }).catch(()=>({ok:false,configured:false}));
    rememberCloud(remote);
    if(remote&&remote.ok&&remote.configured&&remote.site){
      const keep={adminPassword:site.adminPassword,adminPhone:site.adminPhone,sms:site.sms,telegramChatId:site.telegramChatId};
      site=mergeSite(Object.assign({},remote.site,keep));
      saveJSON(K_SITE,site);
    }
    if(remote&&remote.ok&&remote.configured&&remote.bookings){
      bookings=remote.bookings;
      saveJSON(K_BK,bookings);
    }
    const pass=sessionStorage.getItem('mzPass');
    const phone=sessionStorage.getItem('mzPhone');
    if(isStaff()&&pass){
      const full=await cloud('login',{phone,pass});
      if(full&&full.ok){
        if(full.site) site=mergeSite(full.site);
        if(full.bookings) bookings=full.bookings;
        if(full.clients) clients=full.clients;
        saveJSON(K_SITE,site); saveJSON(K_BK,bookings); saveJSON(K_CLIENTS,clients);
        if(!full.site) queueCloudSave({site:1,bookings:1,clients:1});
      }
    }
  }catch(e){}
  rebuildClientsFromBookings();
  if(isStaff()&&bookingsAreFull(bookings)) checkReminders();
  window.addEventListener('hashchange',route);
  route();
})();
})();
</script>
</body>
</html>
